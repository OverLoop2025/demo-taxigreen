name: Deploy web (Railway)

# Despliegue de apps/web a Railway. Requiere credenciales del usuario en Secrets:
#   RAILWAY_TOKEN  (y el servicio enlazado en Railway).
# Hasta que existan, el job queda como manual (workflow_dispatch) y no bloquea CI.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Railway up (apps/web)
    runs-on: ubuntu-latest
    # El contexto `secrets` NO existe en un `if` a nivel de job (GitHub lanza
    # "Unrecognized named-value: 'secrets'"). Se pasa el token a `env` de job
    # (ahí `secrets` sí está disponible) y se condiciona el step de deploy con
    # el contexto `env`, que sí es válido en `if` de step.
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      # Actions en v6 (runtime Node 24); la v4 corría en Node 20, deprecado.
      - name: Checkout
        uses: actions/checkout@v6

      # Sin `version`: action-setup lee `packageManager` (pnpm@10.33.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Sin `cache: pnpm`: este job no corre `pnpm install` (Railway CLI se instala
      # con npm y `railway up` construye en el servidor). Pedir caché de pnpm aquí
      # hacía fallar el post-step "Path Validation Error" porque el store no existe.
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Railway CLI
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: npm i -g @railway/cli

      # `RAILWAY_TOKEN` es un **project token** (scoped a proyecto+environment de
      # Railway). En ese modo el CLI auto-resuelve proyecto y environment desde el
      # token, así que NO se pasa `--project`: hacerlo dispara
      # "--environment is required when using --project" y el deploy falla. Solo se
      # indica el servicio a desplegar. (Verificado contra railway CLI 4.66.x.)
      - name: Deploy
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: railway up --service web --detach
